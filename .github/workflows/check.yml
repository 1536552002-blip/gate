name: VPN Gate Node Check

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Detect SSTP nodes and build distribution
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          CHECK_CONCURRENCY: "16"
          CHECK_TIMEOUT: "90"
          VPNGATE_API: "https://www.vpngate.net/api/iphone/"
          NODES_URL: https://${{ github.repository_owner }}.github.io/gate/nodes.txt
          EDGE_HOSTS: "104.17.108.145:443,172.67.216.79:443"
          OPTIMAL_API: ""
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish distribution
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
